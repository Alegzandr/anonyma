name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # About 6 min, LibreOffice install included: a stuck test must not hold a runner for
    # GitHub's 6 h default (pytest also dumps the stacks of a test stuck for 5 min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for PySide6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libxrender1 libxi6
      # LibreOffice: the legacy doc/xls/ppt contract tests need it.
      - name: LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends             libreoffice-writer libreoffice-calc libreoffice-impress
      - name: LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - name: LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Generate the doc/ppt fixtures (if absent)
        shell: bash
        run: |
          if [ ! -f tests/fixtures/contract/rapport.doc ] ||              [ ! -f tests/fixtures/contract/presentation.ppt ]; then
            uv run python -c "from tests.fixtures.generators.office import make_legacy_with_libreoffice as m; m()"
          fi
          ls tests/fixtures/contract/rapport.doc tests/fixtures/contract/presentation.ppt
      # Short base temp: LibreOffice fails silently on Windows when its throw-away
      # profile path exceeds ~150 characters.
      - run: uv run pytest --basetemp="${{ runner.temp }}/pt"

  build:
    name: Portable build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # About 7 min with the LibreOffice cache; a cold cache downloads LibreOffice again.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for PySide6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 libxcb-cursor0
          # Runtime libraries of the bundled LibreOffice (deb tree, not installed).
          sudo apt-get install -y --no-install-recommends             libxinerama1 libxrandr2 libcups2 libsm6 libice6 libx11-xcb1 libxext6             libcairo2 libnss3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The portable folder ships the language model engine (profil complet).
      # Its prebuilt wheel is skipped: the engine is built from source below.
      - run: uv sync --locked --extra llm --no-install-package llama-cpp-python
      # The engine is rebuilt from source with its GPU backends: Vulkan (any recent
      # GPU driver) as a module that simply does not load on a machine without it, and
      # Metal on macOS. Portable CPU code (no instructions of the build machine).
      - name: Vulkan SDK (GPU backend of the language model engine, Linux)
        if: runner.os == 'Linux'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.363.0
          cache: true
      # The official installer, unattended (as llama.cpp's own CI does on Windows). It
      # is a Qt application: the workflow's offscreen platform would make it hang.
      - name: Vulkan SDK (GPU backend of the language model engine, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\Bin"
      - name: Language model engine with GPU backends
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CMAKE_ARGS="-DGGML_METAL=on -DGGML_NATIVE=off"
          else
            export CMAKE_ARGS="-DGGML_VULKAN=on -DGGML_BACKEND_DL=on -DGGML_NATIVE=off"
          fi
          version=$(uv run --no-sync python -c "import tomllib; print(next(p['version'] for p in tomllib.load(open('uv.lock', 'rb'))['package'] if p['name'] == 'llama-cpp-python'))")
          uv pip install --reinstall --no-deps --no-binary llama-cpp-python \
            --index-url https://pypi.org/simple "llama-cpp-python==$version"
          uv run --no-sync python -c "import llama_cpp; print('llama-cpp', llama_cpp.__version__)"
      - name: Export GLiNER to ONNX (when the script exists)
        if: hashFiles('packaging/export_gliner_onnx.py') != ''
        run: uv run --no-sync python packaging/export_gliner_onnx.py
      # Full build: LibreOffice (pinned, SHA-256 checked) is downloaded here, at build
      # time, and bundled in the portable folder; the cache avoids re-downloading it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/libreoffice-cache
          key: libreoffice-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/libreoffice_bundle.py') }}
      - name: Build, smoke-test (CLI batch, GUI start) and zip the portable folder
        # --no-sync: keep the engine built above (a sync would reinstall the CPU wheel).
        run: uv run --no-sync python packaging/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anonyma-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      # The archive names carry __version__: a tag that does not match it would
      # publish archives named after another version.
      - name: Check the tag matches the package version
        shell: bash
        run: |
          expected="Anonyma-${GITHUB_REF_NAME#v}-"
          ls artifacts/*/*.zip
          for f in artifacts/*/*.zip; do
            case "$(basename "$f")" in
              "$expected"*) ;;
              *) echo "::error::$f does not match tag $GITHUB_REF_NAME (bump __version__ and pyproject.toml)"; exit 1 ;;
            esac
          done
      # Tags with a suffix (v1.2.0-rc1) are published as pre-releases.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*/*.zip
