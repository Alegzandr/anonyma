name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System libraries for PySide6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libxrender1 libxi6
      # LibreOffice: the legacy doc/xls/ppt contract tests need it.
      - name: LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends             libreoffice-writer libreoffice-calc libreoffice-impress
      - name: LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - name: LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Generate the doc/ppt fixtures (if absent)
        shell: bash
        run: |
          if [ ! -f tests/fixtures/contract/rapport.doc ] ||              [ ! -f tests/fixtures/contract/presentation.ppt ]; then
            uv run python -c "from tests.fixtures.generators.office import make_legacy_with_libreoffice as m; m()"
          fi
          ls tests/fixtures/contract/rapport.doc tests/fixtures/contract/presentation.ppt
      # Short base temp: LibreOffice fails silently on Windows when its throw-away
      # profile path exceeds ~150 characters.
      - run: uv run pytest --basetemp="${{ runner.temp }}/pt"

  build:
    name: Portable build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System libraries for PySide6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0 libxcb-cursor0
          # Runtime libraries of the bundled LibreOffice (deb tree, not installed).
          sudo apt-get install -y --no-install-recommends             libxinerama1 libxrandr2 libcups2 libsm6 libice6 libx11-xcb1 libxext6             libcairo2 libnss3
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Export GLiNER to ONNX (when the script exists)
        if: hashFiles('packaging/export_gliner_onnx.py') != ''
        run: uv run python packaging/export_gliner_onnx.py
      # Full build: LibreOffice (pinned, SHA-256 checked) is downloaded here, at build
      # time, and bundled in the portable folder; the cache avoids re-downloading it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/libreoffice-cache
          key: libreoffice-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/libreoffice_bundle.py') }}
      - name: Build, smoke-test (CLI batch, GUI start) and zip the portable folder
        run: uv run python packaging/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anonyma-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      # The archive names carry __version__: a tag that does not match it would
      # publish archives named after another version.
      - name: Check the tag matches the package version
        shell: bash
        run: |
          expected="Anonyma-${GITHUB_REF_NAME#v}-"
          ls artifacts/*/*.zip
          for f in artifacts/*/*.zip; do
            case "$(basename "$f")" in
              "$expected"*) ;;
              *) echo "::error::$f does not match tag $GITHUB_REF_NAME (bump __version__ and pyproject.toml)"; exit 1 ;;
            esac
          done
      # Tags with a suffix (v1.2.0-rc1) are published as pre-releases.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*/*.zip
