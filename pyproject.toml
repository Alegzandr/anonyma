[project]
name = "anonyma"
version = "0.1.0"
description = "Anonymisation locale et en masse de documents de tous formats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Usage interne uniquement (voir LICENSES.md)" }
dependencies = [
    "typer>=0.12",
    "faker>=30",
    "cryptography>=44",
    "huggingface-hub>=1.0",
    "pillow>=11",
    "onnxruntime-directml>=1.20 ; sys_platform == 'win32'",
    "onnxruntime>=1.20 ; sys_platform != 'win32'",
    "rich>=13.8",
    "pyside6-essentials>=6.12.0",
    "py7zr>=1.1.4",
    "pillow-heif>=1.8.1",
    "extract-msg>=0.58.0",
    "libpff-python>=20260926",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python-headless>=4.10",
    "lxml>=6.1.3",
    "xlrd>=2.0.2",
    "olefile>=0.47",
    "pymupdf>=1.26,<2",
    "presidio-analyzer>=2.2.355",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "pyahocorasick>=2.1",
    "phonenumbers>=8.13",
    "zxing-cpp>=2.2",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.3.30",
]

[project.scripts]
anonyma = "anonyma.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.22.3",
    "pytest-qt>=4.5.0",
    "xlwt>=1.3.0",
    "lxml-stubs>=0.5.1",
    "types-regex>=2026.9.29.20261030",
    "qrcode>=7",
]

[tool.uv]
# ONNX Runtime packaging: onnxruntime-directml on Windows (DirectML + CPU providers),
# onnxruntime elsewhere (CoreML + CPU on macOS). Both wheels install the same
# ``onnxruntime`` import package, so they must never coexist. Any transitive
# requirement on plain ``onnxruntime`` (e.g. rapidocr-onnxruntime) is overridden so
# that it only applies outside Windows.
# rapidocr-onnxruntime requires the full opencv-python, whose bundled Qt clashes
# with PySide6 on Linux: it is dropped (impossible marker) in favour of the
# headless build, which provides the same ``cv2`` module.
override-dependencies = [
    "onnxruntime>=1.20 ; sys_platform != 'win32'",
    "opencv-python ; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anonyma"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PLW0603", "PLC0415", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["anonyma"]

[[tool.mypy.overrides]]
module = [
    "docx.*", "pptx.*", "odf.*", "striprtf.*", "fitz.*", "pymupdf.*", "extract_msg.*",
    "pypff.*", "py7zr.*", "pillow_heif.*", "rapidocr.*", "rapidocr_onnxruntime.*",
    "presidio_analyzer.*", "presidio_anonymizer.*", "onnxruntime.*", "llama_cpp.*",
    "faker.*", "xlrd.*", "ahocorasick", "ahocorasick.*", "olefile.*", "tokenizers.*", "psutil.*", "PyInstaller.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships partial, inaccurate inline annotations: treat it as untyped.
module = ["pymupdf", "pymupdf.*", "fitz", "fitz.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests lents (modèles, OCR)",
    "models: nécessite des modèles téléchargés",
]

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }
