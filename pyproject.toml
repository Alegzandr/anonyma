[project]
name = "anonyma"
version = "0.1.0"
description = "Anonymisation locale et en masse de documents de tous formats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Usage interne uniquement (voir LICENSES.md)" }
dependencies = [
    "typer>=0.12",
    "faker>=30",
    "cryptography>=44",
    "huggingface-hub>=0.25",
    "pillow>=11",
    "lxml>=6.1.3",
    "xlrd>=2.0.2",
    "olefile>=0.47",
    "pymupdf>=1.26,<2",
]

[project.optional-dependencies]

[project.scripts]
anonyma = "anonyma.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "xlwt>=1.3.0",
    "lxml-stubs>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anonyma"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PLW0603", "PLC0415", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["anonyma"]

[[tool.mypy.overrides]]
module = [
    "docx.*", "pptx.*", "odf.*", "striprtf.*", "fitz.*", "pymupdf.*", "extract_msg.*",
    "pypff.*", "py7zr.*", "pillow_heif.*", "rapidocr.*", "rapidocr_onnxruntime.*",
    "presidio_analyzer.*", "presidio_anonymizer.*", "onnxruntime.*", "llama_cpp.*",
    "faker.*", "xlrd.*", "olefile.*", "tokenizers.*", "psutil.*", "PyInstaller.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests lents (modèles, OCR)",
    "models: nécessite des modèles téléchargés",
]
