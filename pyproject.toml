[project]
name = "anonyma"
version = "0.1.0"
description = "Anonymisation locale et en masse de documents de tous formats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Usage interne uniquement (voir LICENSES.md)" }
dependencies = [
    "typer>=0.12",
    "faker>=30",
    "cryptography>=44",
    "huggingface-hub>=0.25",
    "pillow>=11",
    "presidio-analyzer>=2.2.355",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "pyahocorasick>=2.1",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.3.30",
]

[project.scripts]
anonyma = "anonyma.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-regex>=2026.9.29.20261030",
]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anonyma"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PLW0603", "PLC0415", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["anonyma"]

[[tool.mypy.overrides]]
module = [
    "docx.*", "pptx.*", "odf.*", "striprtf.*", "fitz.*", "pymupdf.*", "extract_msg.*",
    "pypff.*", "py7zr.*", "pillow_heif.*", "rapidocr.*", "rapidocr_onnxruntime.*",
    "presidio_analyzer.*", "presidio_anonymizer.*", "onnxruntime.*", "llama_cpp.*",
    "faker.*", "xlrd.*", "ahocorasick", "ahocorasick.*", "olefile.*", "tokenizers.*", "psutil.*", "PyInstaller.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests lents (modèles, OCR)",
    "models: nécessite des modèles téléchargés",
]

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }
