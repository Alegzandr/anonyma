[project]
name = "anonyma"
version = "0.1.0"
description = "Anonymisation locale et en masse de documents de tous formats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Usage interne uniquement (voir LICENSES.md)" }
dependencies = [
    "typer>=0.12",
    "faker>=30",
    "cryptography>=44",
    "huggingface-hub>=1.0",
    "pillow>=11",
    "onnxruntime-directml>=1.20 ; sys_platform == 'win32'",
    "onnxruntime>=1.20 ; sys_platform != 'win32'",
    "rich>=13.8",
    "pyside6-essentials>=6.12.0",
]

[project.optional-dependencies]

[project.scripts]
anonyma = "anonyma.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.22.3",
    "pytest-qt>=4.5.0",
]

[tool.uv]
# ONNX Runtime packaging: onnxruntime-directml on Windows (DirectML + CPU providers),
# onnxruntime elsewhere (CoreML + CPU on macOS). Both wheels install the same
# ``onnxruntime`` import package, so they must never coexist. Any transitive
# requirement on plain ``onnxruntime`` (e.g. rapidocr-onnxruntime) is overridden so
# that it only applies outside Windows.
override-dependencies = ["onnxruntime>=1.20 ; sys_platform != 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anonyma"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "PLW0603", "PLC0415", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["anonyma"]

[[tool.mypy.overrides]]
module = [
    "docx.*", "pptx.*", "odf.*", "striprtf.*", "fitz.*", "pymupdf.*", "extract_msg.*",
    "pypff.*", "py7zr.*", "pillow_heif.*", "rapidocr.*", "rapidocr_onnxruntime.*",
    "presidio_analyzer.*", "presidio_anonymizer.*", "onnxruntime.*", "llama_cpp.*",
    "faker.*", "xlrd.*", "olefile.*", "tokenizers.*", "psutil.*", "PyInstaller.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests lents (modèles, OCR)",
    "models: nécessite des modèles téléchargés",
]
